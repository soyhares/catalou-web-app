name: CI — Web App (PWA)

on:
  push:
    branches: [main]      # → solo CI; el deploy a dev llega en la Fase 2
    tags: ['v*']          # → despliega a producción (la orden de pase)
  pull_request:
    branches: [main]

env:
  CONTRACTS_PATH: ${{ github.workspace }}/catalou-platform-core/contracts/openapi
  VITE_API_URL: http://localhost:3000
  VITE_SUPABASE_URL: https://placeholder.supabase.co
  VITE_SUPABASE_ANON_KEY: placeholder
  VITE_CATALOU_DOMAIN: catalou.com
  VITE_DEV_SLUG: ""

jobs:
  ci:
    name: Lint, Type Check, Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: catalou-web-app

      - name: Check out catalou-platform-core
        uses: actions/checkout@v4
        with:
          repository: soyhares/catalou-platform-core
          token: ${{ secrets.PLATFORM_CORE_TOKEN }}
          path: catalou-platform-core

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '10'

      - name: Install dependencies
        working-directory: catalou-web-app
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI types
        working-directory: catalou-web-app
        run: pnpm generate

      - name: Verify generated types are up to date
        working-directory: catalou-web-app
        run: |
          if ! git diff --exit-code src/generated/; then
            echo "❌ src/generated/ was modified manually — regenerate with pnpm generate instead"
            exit 1
          fi
          echo "✅ src/generated/ is clean"

      - name: Type check
        working-directory: catalou-web-app
        run: pnpm typecheck

      - name: Lint
        working-directory: catalou-web-app
        run: pnpm lint

      - name: Build
        working-directory: catalou-web-app
        run: pnpm build

      - name: Verify service worker in build output
        run: |
          ls catalou-web-app/dist/sw.js || ls catalou-web-app/dist/workbox-*.js || \
          (echo "ERROR: No service worker found in dist/" && exit 1)

  # Merge a `main` → despliega al SANDBOX. Worker aparte (`--env sandbox` en
  # wrangler.toml), así que el de producción no se toca.
  deploy-sandbox:
    name: Deploy to sandbox
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: catalou-web-app

      - name: Check out catalou-platform-core
        uses: actions/checkout@v4
        with:
          repository: soyhares/catalou-platform-core
          token: ${{ secrets.PLATFORM_CORE_TOKEN }}
          path: catalou-platform-core

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '10'

      - name: Install dependencies
        working-directory: catalou-web-app
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI types
        working-directory: catalou-web-app
        run: pnpm generate

      - name: Build
        working-directory: catalou-web-app
        env:
          VITE_API_URL: https://api-sandbox.catalou.com
          VITE_SUPABASE_URL: https://dohpjcnwyxjgvrubqelj.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY_SANDBOX }}
          VITE_CATALOU_DOMAIN: catalou.com
          VITE_CATALOG_DOMAIN: catalou.com
          VITE_DEV_SLUG: ""
        run: pnpm build

      - name: Deploy to sandbox
        working-directory: catalou-web-app
        run: pnpm dlx wrangler deploy --env sandbox
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Producción solo se despliega al pushear un tag `v*` — esa es la orden de pase.
  # Mergear a main ya no despliega nada: corre el CI y espera.
  # ponytail: el destino `dev` entra con la Fase 2, cuando existan los subdominios
  # y el Supabase de dev. Declararlo antes dejaría un deploy roto en cada merge.
  deploy:
    name: Deploy to Cloudflare Pages (production)
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: catalou-web-app

      # Un tag sobre un commit que no está en main desplegaría igual: es lo único que este
      # esquema no trae de fábrica.
      - name: Refuse a tag that is not on main
        working-directory: catalou-web-app
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "❌ El tag ${GITHUB_REF#refs/tags/} apunta a un commit que no está en main."
            echo "   Producción solo se despliega desde main."
            exit 1
          fi
          echo "🚀 PRODUCCIÓN — tag ${GITHUB_REF#refs/tags/}, commit en main"

      - name: Check out catalou-platform-core
        uses: actions/checkout@v4
        with:
          repository: soyhares/catalou-platform-core
          token: ${{ secrets.PLATFORM_CORE_TOKEN }}
          path: catalou-platform-core

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: '10'

      - name: Install dependencies
        working-directory: catalou-web-app
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI types
        working-directory: catalou-web-app
        run: pnpm generate

      - name: Build
        working-directory: catalou-web-app
        env:
          VITE_API_URL: https://api.catalou.com
          VITE_SUPABASE_URL: https://eqrrxrilgddxcxewaonc.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CATALOU_DOMAIN: catalou.com
          VITE_CATALOG_DOMAIN: catalou.com
          VITE_DEV_SLUG: ""
        run: pnpm build

      - name: Deploy to Cloudflare Workers
        working-directory: catalou-web-app
        run: pnpm dlx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
